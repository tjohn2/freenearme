name: Warm registered source coverage
on:
  schedule:
    - cron: "47 */4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
    steps:
      - id: sources
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 2             "https://freenearme.netlify.app/api/source-centers" -o /tmp/sources.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('/tmp/sources.json'))
          print("matrix="+json.dumps(d.get("sources",[])[:80],separators=(',',':')))
          PY
  warm:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        source: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Warm source center
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 25 --retry 2 --retry-delay 3             "https://freenearme.netlify.app/api/nearby?lat=${{ matrix.source.lat }}&lng=${{ matrix.source.lng }}&radius=${{ matrix.source.radius }}"             -o /tmp/result.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          assert isinstance(d.get("items"), list), d
          print("items", len(d["items"]))
          PY
